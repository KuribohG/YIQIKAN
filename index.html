<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一起看 - B站同步观影</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <!-- WebSocket relay via Cloudflare Worker -->
  <style>
    /* ========== Reset & Base ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #141416;
      --bg-card: #1c1c1f;
      --bg-input: #252528;
      --border: #2a2a2e;
      --text-primary: #e8e8ea;
      --text-secondary: #9a9aa0;
      --text-muted: #5a5a60;
      --accent: #00aeec;
      --accent-hover: #00c0ff;
      --accent-dim: rgba(0, 174, 236, 0.15);
      --pink: #fb7299;
      --pink-hover: #fc8bab;
      --success: #4caf50;
      --warning: #ff9800;
      --danger: #f44336;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --header-h: 56px;
    }

    html { font-size: 16px; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========== Scrollbar ========== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ========== Header ========== */
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.1rem; font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
    }

    .header-brand svg { width: 28px; height: 28px; }

    .header-status {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; color: var(--text-secondary);
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

    .header-actions { display: flex; gap: 8px; }

    /* ========== Buttons ========== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 8px 16px;
      border: none; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      color: var(--text-primary);
      background: var(--bg-input);
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-pink { background: var(--pink); color: #fff; }
    .btn-pink:hover { background: var(--pink-hover); }

    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-icon { padding: 8px; width: 36px; height: 36px; }

    /* ========== Main Layout ========== */
    .main {
      margin-top: var(--header-h);
      display: flex;
      height: calc(100vh - var(--header-h));
    }

    .player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .sidebar {
      width: 360px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* ========== Video Container ========== */
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      flex-shrink: 0;
    }

    .video-container::before {
      content: '';
      display: block;
      padding-top: 56.25%;
    }

    .video-container iframe,
    .video-placeholder {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .video-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      background: linear-gradient(135deg, #0d0d0f 0%, #1a1a1e 100%);
      color: var(--text-secondary);
    }

    .video-placeholder svg { width: 64px; height: 64px; opacity: 0.3; }
    .video-placeholder p { font-size: 0.95rem; }

    /* ========== Danmaku Overlay ========== */
    .danmaku-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8), -1px -1px 2px rgba(0,0,0,0.8);
      animation: danmaku-scroll linear forwards;
      will-change: transform;
      pointer-events: none;
    }

    @keyframes danmaku-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(calc(-100% - 100vw)); }
    }

    /* ========== Controls Bar ========== */
    .controls-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .video-input-group {
      flex: 1;
      display: flex; gap: 8px;
      min-width: 200px;
    }

    .video-input-group input {
      flex: 1;
      padding: 8px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .video-input-group input:focus { border-color: var(--accent); }
    .video-input-group input::placeholder { color: var(--text-muted); }

    .danmaku-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.8rem; color: var(--text-secondary);
      cursor: pointer; user-select: none;
    }

    .toggle-switch {
      position: relative;
      width: 36px; height: 20px;
      background: var(--bg-input);
      border-radius: 10px;
      transition: background 0.3s;
      cursor: pointer;
    }
    .toggle-switch.active { background: var(--accent); }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle-switch.active::after { transform: translateX(16px); }

    /* ========== Danmaku Input ========== */
    .danmaku-input-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
    }

    .danmaku-input-bar input {
      flex: 1;
      padding: 8px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .danmaku-input-bar input:focus { border-color: var(--pink); }
    .danmaku-input-bar input::placeholder { color: var(--text-muted); }

    .color-picker-wrapper {
      position: relative;
    }
    .color-picker-wrapper input[type="color"] {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      background: none;
      padding: 0;
    }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

    /* ========== Sidebar Tabs ========== */
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-tab {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .sidebar-tab:hover { color: var(--text-primary); }
    .sidebar-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ========== Chat Panel ========== */
    .sidebar-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tab-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .chat-msg {
      display: flex; gap: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      word-break: break-all;
    }

    .chat-msg .nick {
      color: var(--accent);
      font-weight: 600;
      flex-shrink: 0;
    }

    .chat-msg .text { color: var(--text-primary); }

    .chat-msg.system {
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .chat-input-bar {
      display: flex; gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-input-bar input {
      flex: 1;
      padding: 8px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
    }
    .chat-input-bar input:focus { border-color: var(--accent); }

    /* ========== Room Panel ========== */
    .room-panel {
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      gap: 16px;
    }

    .room-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .room-section h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex; align-items: center; gap: 8px;
    }

    .room-section p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .room-id-display {
      display: flex; align-items: center; gap: 8px;
    }

    .room-id-display code {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      word-break: break-all;
    }

    .room-input-group {
      display: flex; gap: 8px;
    }

    .room-input-group input {
      flex: 1;
      padding: 8px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
    }
    .room-input-group input:focus { border-color: var(--accent); }

    .members-list {
      display: flex; flex-direction: column; gap: 6px;
    }

    .member-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
    }

    .member-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent-dim);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
      color: var(--accent);
    }

    .member-name { flex: 1; }
    .member-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--accent);
    }

    .nickname-input {
      padding: 8px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }
    .nickname-input:focus { border-color: var(--accent); }

    /* ========== Welcome Overlay ========== */
    .welcome-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .welcome-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      gap: 24px;
      animation: fadeInUp 0.4s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-header {
      text-align: center;
      display: flex; flex-direction: column; gap: 8px;
    }

    .welcome-header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-header p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .welcome-form {
      display: flex; flex-direction: column; gap: 16px;
    }

    .form-group {
      display: flex; flex-direction: column; gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input {
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); }

    .welcome-actions {
      display: flex; gap: 12px;
    }
    .welcome-actions .btn { flex: 1; padding: 12px; font-size: 0.9rem; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1; height: 1px;
      background: var(--border);
    }

    /* ========== Toast ========== */
    .toast-container {
      position: fixed;
      top: calc(var(--header-h) + 12px);
      right: 16px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 10px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--text-primary);
      box-shadow: var(--shadow);
      animation: toastIn 0.3s ease;
      max-width: 320px;
    }

    .toast.success { border-left: 3px solid var(--success); }
    .toast.warning { border-left: 3px solid var(--warning); }
    .toast.error   { border-left: 3px solid var(--danger); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ========== Mobile Sidebar Toggle ========== */
    .sidebar-toggle {
      display: none;
      position: fixed;
      bottom: 20px; right: 20px;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      z-index: 999;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,174,236,0.4);
      font-size: 1.2rem;
    }

    /* ========== Responsive ========== */
    @media (max-width: 768px) {
      .header { padding: 0 12px; }
      .header-brand span { display: none; }

      .main { flex-direction: column; }

      .sidebar {
        position: fixed;
        top: var(--header-h); left: 0; right: 0; bottom: 0;
        width: 100%;
        z-index: 900;
        transform: translateX(100%);
        transition: transform 0.3s ease;
      }
      .sidebar.open { transform: translateX(0); }

      .sidebar-toggle { display: flex; align-items: center; justify-content: center; }

      .player-area {
        height: auto;
        flex: none;
      }

      .controls-bar { padding: 8px 12px; }
      .video-input-group { min-width: 0; }

      .danmaku-input-bar { padding: 8px 12px; }

      .danmaku-item { font-size: 14px; }

      .welcome-card { padding: 24px; margin: 12px; }
    }

    @media (max-width: 480px) {
      .controls-bar { gap: 8px; flex-direction: column; }
      .video-input-group { width: 100%; }
    }

    /* ========== Voice Chat ========== */
    .voice-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .btn-voice {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 8px 16px;
      border: none; border-radius: 20px;
      font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      color: var(--text-primary);
      background: var(--bg-input);
    }
    .btn-voice:hover { background: var(--border); }
    .btn-voice.active {
      background: var(--success);
      color: #fff;
      box-shadow: 0 0 12px rgba(76,175,80,0.3);
    }
    .btn-voice.active:hover { background: #43a047; }

    .btn-mute {
      padding: 8px; width: 34px; height: 34px;
      border: none; border-radius: 50%;
      background: var(--bg-input);
      color: var(--text-primary);
      cursor: pointer; transition: all 0.2s;
      display: none; align-items: center; justify-content: center;
    }
    .btn-mute:hover { background: var(--border); }
    .btn-mute.muted { background: var(--danger); color: #fff; }
    .btn-mute.show { display: inline-flex; }

    .voice-users {
      flex: 1;
      font-size: 0.75rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
      70% { box-shadow: 0 0 0 8px rgba(76,175,80,0); }
      100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
    }
    .btn-voice.active { animation: pulse-ring 2s infinite; }

    /* ========== Utility ========== */
    .hidden { display: none !important; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-brand" onclick="sessionStorage.clear(); location.hash=''; location.reload();">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <span>一起看</span>
    </div>
    <div class="header-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">未连接</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm" id="btnShare" title="分享房间链接">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        分享
      </button>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <div class="main">
    <!-- Player Area -->
    <div class="player-area">
      <div class="video-container" id="videoContainer">
        <!-- Danmaku Layer -->
        <div class="danmaku-layer" id="danmakuLayer"></div>
        <!-- Placeholder -->
        <div class="video-placeholder" id="videoPlaceholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <p>输入B站或YouTube链接开始观看</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-bar">
        <div class="video-input-group">
          <input type="text" id="videoUrlInput" placeholder="粘贴B站或YouTube视频链接">
          <button class="btn btn-primary" id="btnLoadVideo">播放</button>
        </div>
        <label class="danmaku-toggle">
          <div class="toggle-switch active" id="danmakuToggle"></div>
          弹幕
        </label>
      </div>

      <!-- Danmaku Input -->
      <div class="danmaku-input-bar">
        <div class="color-picker-wrapper">
          <input type="color" id="danmakuColor" value="#ffffff" title="弹幕颜色">
        </div>
        <input type="text" id="danmakuInput" placeholder="发个友善的弹幕见证这一刻~" maxlength="100">
        <button class="btn btn-pink btn-sm" id="btnSendDanmaku">发送</button>
      </div>

    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" data-tab="chat">聊天</div>

          <label>输入房间ID</label>

<script>
// ============================================================
// 一起看 - Main Application (v3 - WebSocket relay)
// ============================================================

;(function() {
  'use strict';

  // ===== Config =====
  const WS_URL = 'wss://yiqikan-relay.zouyuheng1998.workers.dev/ws/';
  const DANMAKU_SPEED = 8;
  const DANMAKU_MAX = 60;
  const RECONNECT_MAX = 10;
  const RECONNECT_DELAY = 2000;
  const HEARTBEAT_INTERVAL = 15000;

  // ===== State =====
  const state = {
    nickname: '',
    sessionId: '',
    roomId: '',
    isHost: false,
    ws: null,
    currentBvid: '',
    danmakuEnabled: true,
    danmakuCount: 0,
    reconnectAttempts: 0,
    heartbeatTimer: null,
    connected: false,
    // Voice chat
    inVoice: false,
    muted: false,
    localStream: null,
    peerConnections: new Map(), // sessionId -> RTCPeerConnection
    voiceUsers: new Set(),      // sessionIds in voice
  };

  // ===== DOM Refs =====
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  const els = {
    welcomeOverlay: $('#welcomeOverlay'),
    welcomeNickname: $('#welcomeNickname'),
    btnCreateRoom: $('#btnCreateRoom'),
    btnShowJoin: $('#btnShowJoin'),
    joinRoomGroup: $('#joinRoomGroup'),
    joinRoomInput: $('#joinRoomInput'),
    btnJoinRoom: $('#btnJoinRoom'),
    videoContainer: $('#videoContainer'),
    videoPlaceholder: $('#videoPlaceholder'),
    danmakuLayer: $('#danmakuLayer'),
    videoUrlInput: $('#videoUrlInput'),
    btnLoadVideo: $('#btnLoadVideo'),
    danmakuToggle: $('#danmakuToggle'),
    danmakuInput: $('#danmakuInput'),
    danmakuColor: $('#danmakuColor'),
    btnSendDanmaku: $('#btnSendDanmaku'),
    sidebar: $('#sidebar'),
    sidebarToggle: $('#sidebarToggle'),
    chatMessages: $('#chatMessages'),
    chatInput: $('#chatInput'),
    btnSendChat: $('#btnSendChat'),
    roomIdDisplay: $('#roomIdDisplay'),
    btnCopyRoomId: $('#btnCopyRoomId'),
    memberCount: $('#memberCount'),
    membersList: $('#membersList'),
    nicknameInput: $('#nicknameInput'),
    statusDot: $('#statusDot'),
    statusText: $('#statusText'),
    btnShare: $('#btnShare'),
    toastContainer: $('#toastContainer'),
    btnVoice: $('#btnVoice'),
    btnMute: $('#btnMute'),
    voiceUsers: $('#voiceUsers'),
  };

  // ===== Logging =====
  function log(tag, ...args) {
    console.log(`[${tag}]`, ...args);
  }

  // ===== Toast =====
  function toast(message, type = 'success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = message;
    els.toastContainer.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; }, 2500);
    setTimeout(() => t.remove(), 2800);
  }

  // ===== Utility =====
  function generateRoomId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let id = '';
    for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
    return id;
  }

  // parseVideoInput returns { platform: 'bilibili'|'youtube', id: string } or null
  function parseVideoInput(input) {
    input = input.trim();

    // --- Bilibili ---
    if (/^BV[\w]+$/i.test(input)) return { platform: 'bilibili', id: input };
    const bvMatch = input.match(/bilibili\.com\/video\/(BV[\w]+)/i);
    if (bvMatch) return { platform: 'bilibili', id: bvMatch[1] };
    if (input.includes('b23.tv')) {
      toast('请使用完整B站链接（非短链接）', 'warning');
      return null;
    }
    if (/bilibili\.com\/video\/av\d+/i.test(input)) {
      toast('暂不支持av号，请使用BV号链接', 'warning');
      return null;
    }

    // --- YouTube ---
    // youtube.com/watch?v=ID
    const ytWatch = input.match(/(?:youtube\.com|youtube-nocookie\.com)\/watch\?.*v=([\w-]{11})/i);
    if (ytWatch) return { platform: 'youtube', id: ytWatch[1] };
    // youtu.be/ID
    const ytShort = input.match(/youtu\.be\/([\w-]{11})/i);
    if (ytShort) return { platform: 'youtube', id: ytShort[1] };
    // youtube.com/embed/ID
    const ytEmbed = input.match(/youtube\.com\/embed\/([\w-]{11})/i);
    if (ytEmbed) return { platform: 'youtube', id: ytEmbed[1] };
    // youtube.com/shorts/ID
    const ytShorts = input.match(/youtube\.com\/shorts\/([\w-]{11})/i);
    if (ytShorts) return { platform: 'youtube', id: ytShorts[1] };
    // bare YouTube ID (11 chars)
    if (/^[\w-]{11}$/.test(input)) return { platform: 'youtube', id: input };

    return null;
  }

  // Encode video info as a single string for sync: "bilibili:BVxxx" or "youtube:xxx"
  function encodeVideoKey(video) {
    return `${video.platform}:${video.id}`;
  }

  function decodeVideoKey(key) {
    const i = key.indexOf(':');
    if (i === -1) return { platform: 'bilibili', id: key }; // backward compat
    return { platform: key.substring(0, i), id: key.substring(i + 1) };
  }

  function getEmbedUrl(video) {
    if (video.platform === 'youtube') {
      return `https://www.youtube.com/embed/${video.id}?autoplay=1&rel=0`;
    }
    return `https://player.bilibili.com/player.html?bvid=${video.id}&page=1&high_quality=1&danmaku=0&autoplay=1`;
  }

  function getDisplayUrl(video) {
    if (video.platform === 'youtube') {
      return `https://www.youtube.com/watch?v=${video.id}`;
    }
    return `https://www.bilibili.com/video/${video.id}`;
  }

  // ===== Video =====
  function loadVideo(videoKey, fromSync = false) {
    if (!videoKey) return;
    state.currentBvid = videoKey;
    try { sessionStorage.setItem('yqk_video', typeof videoKey === 'string' ? videoKey : encodeVideoKey(videoKey)); } catch(e) {}

    const video = typeof videoKey === 'string' ? decodeVideoKey(videoKey) : videoKey;

    const existing = els.videoContainer.querySelector('iframe');
    if (existing) existing.remove();

    els.videoPlaceholder.classList.add('hidden');

    const iframe = document.createElement('iframe');
    iframe.src = getEmbedUrl(video);
    iframe.allowFullscreen = true;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    if (video.platform === 'bilibili') {
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms allow-presentation');
    }
    els.videoContainer.insertBefore(iframe, els.danmakuLayer);

    els.videoUrlInput.value = getDisplayUrl(video);

    const key = typeof videoKey === 'string' ? videoKey : encodeVideoKey(video);
    if (!fromSync) {
      wsSend({ type: 'video', bvid: key });
      addSystemMessage(`正在播放: ${getDisplayUrl(video)}`);
    }
  }

  // ===== Danmaku System =====
  function fireDanmaku(text, color = '#ffffff', fromSync = false) {
    if (!state.danmakuEnabled) return;
    if (state.danmakuCount >= DANMAKU_MAX) return;

    const layer = els.danmakuLayer;
    const containerH = layer.offsetHeight;
    if (containerH === 0) return;

    const item = document.createElement('div');
    item.className = 'danmaku-item';
    item.textContent = text;
    item.style.color = color;

    const top = Math.random() * (containerH * 0.8) + containerH * 0.1;
    item.style.top = top + 'px';
    item.style.right = '-100%';
    item.style.transform = 'translateX(0)';

    const speed = DANMAKU_SPEED + Math.random() * 2;
    item.style.animationDuration = speed + 's';

    layer.appendChild(item);
    state.danmakuCount++;

    item.addEventListener('animationend', () => {
      item.remove();
      state.danmakuCount--;
    });

    if (!fromSync) {
      wsSend({ type: 'danmaku', text, color });
    }
  }

  function sendDanmaku() {
    const text = els.danmakuInput.value.trim();
    if (!text) return;
    const color = els.danmakuColor.value;
    fireDanmaku(text, color);
    els.danmakuInput.value = '';
  }

  // ===== Chat =====
  function addChatMessage(nick, text) {
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="nick">${escapeHtml(nick)}</span> <span class="text">${escapeHtml(text)}</span>`;
    els.chatMessages.appendChild(div);
    els.chatMessages.scrollTop = els.chatMessages.scrollHeight;
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'chat-msg system';
    div.innerHTML = `<span class="text">${escapeHtml(text)}</span>`;
    els.chatMessages.appendChild(div);
    els.chatMessages.scrollTop = els.chatMessages.scrollHeight;
  }

  function sendChat() {
    const text = els.chatInput.value.trim();
    if (!text) return;
    addChatMessage(state.nickname, text);
    wsSend({ type: 'chat', text });
    els.chatInput.value = '';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== Members =====
  function updateMembersList(list) {
    els.memberCount.textContent = list.length;
    els.membersList.innerHTML = list.map(m => `
      <div class="member-item">
        <div class="member-avatar">${(m.nickname || '?')[0].toUpperCase()}</div>
        <span class="member-name">${escapeHtml(m.nickname || '未知')}</span>
        ${m.isHost ? '<span class="member-badge">房主</span>' : ''}
      </div>
    `).join('');
  }

  // ===== WebSocket Networking =====
  function connectRoom(roomId) {
    state.roomId = roomId;
    state.reconnectAttempts = 0;
    // Persist session for refresh recovery
    try {
      sessionStorage.setItem('yqk_room', roomId);
      sessionStorage.setItem('yqk_nick', state.nickname);
    } catch(e) {}
    doConnect();
  }

  function doConnect() {
    const url = WS_URL + state.roomId;
    log('WS', `Connecting to ${url} (attempt ${state.reconnectAttempts + 1})`);
    setStatus('connecting', '正在连接...');

    try {
      state.ws = new WebSocket(url);
    } catch(e) {
      log('WS', 'WebSocket constructor error:', e);
      scheduleReconnect();
      return;
    }

    state.ws.onopen = () => {
      log('WS', 'Connected!');
      state.connected = true;
      state.reconnectAttempts = 0;
      setStatus('connected', '已连接');
      els.roomIdDisplay.textContent = state.roomId;

      // Send join message
      wsSend({ type: 'join', nickname: state.nickname });
      startHeartbeat();
    };

    state.ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        handleMessage(data);
      } catch(e) {
        log('WS', 'Failed to parse message:', e);
      }
    };

    state.ws.onclose = (event) => {
      log('WS', `Closed: code=${event.code} reason=${event.reason}`);
      state.connected = false;
      stopHeartbeat();
      // Cleanup voice on disconnect
      if (state.inVoice) { leaveVoice(); }

      if (state.roomId) {
        setStatus('connecting', '连接断开，正在重连...');
        scheduleReconnect();
      }
    };

    state.ws.onerror = (event) => {
      log('WS', 'Error:', event);
    };
  }

  function scheduleReconnect() {
    if (state.reconnectAttempts >= RECONNECT_MAX) {
      toast('无法连接服务器，请刷新重试', 'error');
      setStatus('error', '连接失败');
      return;
    }
    state.reconnectAttempts++;
    const delay = Math.min(RECONNECT_DELAY * state.reconnectAttempts, 10000);
    log('WS', `Reconnect in ${delay}ms (${state.reconnectAttempts}/${RECONNECT_MAX})`);
    setTimeout(() => {
      if (state.roomId) doConnect();
    }, delay);
  }

  function wsSend(data) {
    if (state.ws && state.ws.readyState === WebSocket.OPEN) {
      state.ws.send(JSON.stringify(data));
    }
  }

  // --- Message handler ---
  function handleMessage(data) {
    if (!data || !data.type) return;
    if (data.type === 'pong') return;

    log('MSG', data.type, data);

    switch (data.type) {
      case 'welcome':
        // Server tells us our session info and current state
        state.sessionId = data.sessionId;
        state.isHost = data.isHost;
        log('WS', `Session: ${data.sessionId}, isHost: ${data.isHost}`);
        if (data.currentBvid) {
          loadVideo(data.currentBvid, true);
          addSystemMessage(`正在播放: ${data.currentBvid}`);
        }
        toast(data.isHost ? '房间创建成功！' : '成功加入房间!');
        break;

      case 'video':
        loadVideo(data.bvid, true);
        addSystemMessage(`视频已切换: ${data.bvid}`);
        break;

      case 'danmaku':
        fireDanmaku(data.text, data.color, true);
        break;

      case 'chat':
        addChatMessage(data.nick, data.text);
        break;

      case 'members':
        updateMembersList(data.list);
        break;

      case 'chat_system':
        addSystemMessage(data.text);
        break;

      // --- Voice signaling ---
      case 'rtc_join_voice':
        state.voiceUsers.add(data.from);
        updateVoiceUsers();
        // If we're in voice, initiate connection to the new peer
        if (state.inVoice) {
          createPeerConnection(data.from, true);
        }
        break;

      case 'rtc_leave_voice':
        state.voiceUsers.delete(data.from);
        cleanupPeer(data.from);
        updateVoiceUsers();
        break;

      case 'rtc_offer':
        handleRtcOffer(data);
        break;

      case 'rtc_answer':
        handleRtcAnswer(data);
        break;

      case 'rtc_ice':
        handleRtcIce(data);
        break;
    }
  }

  // --- Heartbeat ---
  function startHeartbeat() {
    stopHeartbeat();
    state.heartbeatTimer = setInterval(() => {
      wsSend({ type: 'ping' });
    }, HEARTBEAT_INTERVAL);
  }

  function stopHeartbeat() {
    if (state.heartbeatTimer) {
      clearInterval(state.heartbeatTimer);
      state.heartbeatTimer = null;
    }
  }

  // --- Status ---
  function setStatus(status, text) {
    const dot = els.statusDot;
    dot.className = 'status-dot';
    if (status === 'connected') dot.classList.add('connected');
    els.statusText.textContent = text;
  }

  // ===== Voice Chat (WebRTC) =====
  const RTC_CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ]
  };

  async function joinVoice() {
    try {
      state.localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch(e) {
      log('Voice', 'Mic access denied:', e);
      toast('无法访问麦克风', 'error');
      return;
    }

    state.inVoice = true;
    state.muted = false;
    els.btnVoice.classList.add('active');
    els.btnVoice.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> 挂断';
    els.btnMute.classList.add('show');
    toast('已开启语音');

    // Tell server we joined voice
    wsSend({ type: 'rtc_join_voice' });

    // Create peer connections to all existing voice users
    for (const peerId of state.voiceUsers) {
      createPeerConnection(peerId, true);
    }

    state.voiceUsers.add(state.sessionId);
    updateVoiceUsers();
  }

  function leaveVoice() {
    state.inVoice = false;

    // Stop mic
    if (state.localStream) {
      state.localStream.getTracks().forEach(t => t.stop());
      state.localStream = null;
    }

    // Close all peer connections
    for (const [id, pc] of state.peerConnections) {
      pc.close();
    }
    state.peerConnections.clear();

    els.btnVoice.classList.remove('active');
    els.btnVoice.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> 语音';
    els.btnMute.classList.remove('show', 'muted');

    wsSend({ type: 'rtc_leave_voice' });
    state.voiceUsers.delete(state.sessionId);
    updateVoiceUsers();
    toast('已退出语音');
  }

  function toggleMute() {
    if (!state.localStream) return;
    state.muted = !state.muted;
    state.localStream.getAudioTracks().forEach(t => { t.enabled = !state.muted; });
    els.btnMute.classList.toggle('muted', state.muted);
    els.btnMute.title = state.muted ? '取消静音' : '静音';
  }

  function createPeerConnection(remoteId, isInitiator) {
    if (state.peerConnections.has(remoteId)) return;
    log('Voice', `Creating PC to ${remoteId}, initiator=${isInitiator}`);

    const pc = new RTCPeerConnection(RTC_CONFIG);
    state.peerConnections.set(remoteId, pc);

    // Add local audio tracks
    if (state.localStream) {
      state.localStream.getTracks().forEach(track => {
        pc.addTrack(track, state.localStream);
      });
    }

    // Play remote audio
    pc.ontrack = (event) => {
      log('Voice', `Got remote track from ${remoteId}`);
      const audio = document.createElement('audio');
      audio.srcObject = event.streams[0];
      audio.autoplay = true;
      audio.id = `audio-${remoteId}`;
      document.body.appendChild(audio);
    };

    // ICE candidates
    pc.onicecandidate = (event) => {
      if (event.candidate) {
        wsSend({
          type: 'rtc_ice',
          target: remoteId,
          candidate: event.candidate,
        });
      }
    };

    pc.onconnectionstatechange = () => {
      log('Voice', `PC ${remoteId} state: ${pc.connectionState}`);
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        cleanupPeer(remoteId);
      }
    };

    // If initiator, create offer
    if (isInitiator) {
      pc.createOffer().then(offer => {
        return pc.setLocalDescription(offer);
      }).then(() => {
        wsSend({
          type: 'rtc_offer',
          target: remoteId,
          sdp: pc.localDescription,
        });
      }).catch(e => log('Voice', 'Offer error:', e));
    }

    return pc;
  }

  function handleRtcOffer(data) {
    if (!state.inVoice) return;
    const pc = createPeerConnection(data.from, false);
    if (!pc) return;

    pc.setRemoteDescription(new RTCSessionDescription(data.sdp))
      .then(() => pc.createAnswer())
      .then(answer => pc.setLocalDescription(answer))
      .then(() => {
        wsSend({
          type: 'rtc_answer',
          target: data.from,
          sdp: pc.localDescription,
        });
      })
      .catch(e => log('Voice', 'Answer error:', e));
  }

  function handleRtcAnswer(data) {
    const pc = state.peerConnections.get(data.from);
    if (pc) {
      pc.setRemoteDescription(new RTCSessionDescription(data.sdp))
        .catch(e => log('Voice', 'setRemoteDesc error:', e));
    }
  }

  function handleRtcIce(data) {
    const pc = state.peerConnections.get(data.from);
    if (pc) {
      pc.addIceCandidate(new RTCIceCandidate(data.candidate))
        .catch(e => log('Voice', 'addIceCandidate error:', e));
    }
  }

  function cleanupPeer(remoteId) {
    const pc = state.peerConnections.get(remoteId);
    if (pc) { try { pc.close(); } catch(e) {} }
    state.peerConnections.delete(remoteId);
    const audioEl = document.getElementById(`audio-${remoteId}`);
    if (audioEl) audioEl.remove();
  }

  function updateVoiceUsers() {
    const count = state.voiceUsers.size;
    els.voiceUsers.textContent = count > 0 ? `${count}人在语音中` : '';
  }

  // ===== UI Event Handlers =====
  function initUI() {
    // Welcome - Create Room
    els.btnCreateRoom.addEventListener('click', () => {
      const nick = els.welcomeNickname.value.trim() || '观众' + Math.floor(Math.random() * 1000);
      state.nickname = nick;
      els.nicknameInput.value = nick;

      const roomId = generateRoomId();
      connectRoom(roomId);
      els.welcomeOverlay.classList.add('hidden');
    });

    // Welcome - Show Join
    els.btnShowJoin.addEventListener('click', () => {
      els.joinRoomGroup.classList.toggle('hidden');
      els.joinRoomInput.focus();
    });

    // Welcome - Join Room
    els.btnJoinRoom.addEventListener('click', () => {
      const nick = els.welcomeNickname.value.trim() || '观众' + Math.floor(Math.random() * 1000);
      const roomId = els.joinRoomInput.value.trim().toUpperCase();
      if (!roomId) { toast('请输入房间ID', 'warning'); return; }
      state.nickname = nick;
      els.nicknameInput.value = nick;
      connectRoom(roomId);
      els.welcomeOverlay.classList.add('hidden');
    });

    els.joinRoomInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') els.btnJoinRoom.click();
    });

    els.welcomeNickname.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') els.btnCreateRoom.click();
    });

    // Load Video
    els.btnLoadVideo.addEventListener('click', () => {
      const video = parseVideoInput(els.videoUrlInput.value);
      if (!video) { toast('请输入B站或YouTube视频链接', 'warning'); return; }
      loadVideo(encodeVideoKey(video));
    });

    els.videoUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') els.btnLoadVideo.click();
    });

    // Danmaku Toggle
    els.danmakuToggle.addEventListener('click', () => {
      state.danmakuEnabled = !state.danmakuEnabled;
      els.danmakuToggle.classList.toggle('active', state.danmakuEnabled);
      if (!state.danmakuEnabled) {
        els.danmakuLayer.innerHTML = '';
        state.danmakuCount = 0;
      }
    });

    // Send Danmaku
    els.btnSendDanmaku.addEventListener('click', sendDanmaku);
    els.danmakuInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendDanmaku();
    });

    // Send Chat
    els.btnSendChat.addEventListener('click', sendChat);
    els.chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChat();
    });

    // Sidebar Tabs
    $$('.sidebar-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        $$('.sidebar-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        $('#tabChat').classList.toggle('hidden', target !== 'chat');
        $('#tabRoom').classList.toggle('hidden', target !== 'room');
      });
    });

    // Sidebar Toggle (mobile)
    els.sidebarToggle.addEventListener('click', () => {
      els.sidebar.classList.toggle('open');
    });

    // Close sidebar on outside click (mobile)
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 &&
          els.sidebar.classList.contains('open') &&
          !els.sidebar.contains(e.target) &&
          e.target !== els.sidebarToggle &&
          !els.sidebarToggle.contains(e.target)) {
        els.sidebar.classList.remove('open');
      }
    });

    // Copy Room ID
    els.btnCopyRoomId.addEventListener('click', () => {
      const id = els.roomIdDisplay.textContent;
      if (id === '--') return;
      navigator.clipboard.writeText(id).then(() => toast('房间ID已复制'));
    });

    // Share
    els.btnShare.addEventListener('click', () => {
      if (!state.roomId) { toast('请先创建或加入房间', 'warning'); return; }
      const url = `${location.origin}${location.pathname}#room=${state.roomId}`;
      navigator.clipboard.writeText(url).then(() => toast('链接已复制到剪贴板'));
    });

    // Nickname change
    els.nicknameInput.addEventListener('change', () => {
      const newNick = els.nicknameInput.value.trim();
      if (!newNick || newNick === state.nickname) return;
      state.nickname = newNick;
      wsSend({ type: 'nick_change', nickname: newNick });
    });

    // Check URL hash for room invitation
    // Voice chat
    els.btnVoice.addEventListener('click', () => {
      if (state.inVoice) { leaveVoice(); } else { joinVoice(); }
    });

    els.btnMute.addEventListener('click', toggleMute);

    // Try to restore session first, then check hash invite
    if (!tryRestoreSession()) {
      checkHashInvite();
    }
  }

  function tryRestoreSession() {
    try {
      const roomId = sessionStorage.getItem('yqk_room');
      const nick = sessionStorage.getItem('yqk_nick');
      if (roomId && nick) {
        log('Session', `Restoring: room=${roomId}, nick=${nick}`);
        state.nickname = nick;
        els.nicknameInput.value = nick;

        // Restore video from storage (will be overridden by server welcome)
        const savedVideo = sessionStorage.getItem('yqk_video');
        if (savedVideo) {
          loadVideo(savedVideo, true);
        }

        connectRoom(roomId);
        els.welcomeOverlay.classList.add('hidden');
        toast('已恢复房间连接');
        return true;
      }
    } catch(e) {}
    return false;
  }

  function checkHashInvite() {
    const hash = location.hash;
    const match = hash.match(/room=([A-Za-z0-9]+)/);
    if (match) {
      const roomId = match[1].toUpperCase();
      els.joinRoomInput.value = roomId;
      els.joinRoomGroup.classList.remove('hidden');
      els.welcomeNickname.focus();
    }
  }

  // ===== Init =====
  document.addEventListener('DOMContentLoaded', initUI);

})();
</script>
</body>
</html>
